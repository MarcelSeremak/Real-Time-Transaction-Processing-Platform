services:

  postgres:
    image: postgres:16
    container_name: transaction-postgres
    env_file:
      - ../config/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transaction-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  alembic:
    build:
      context: ..
      dockerfile: docker/Dockerfile.alembic
    container_name: transaction-alembic
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT_INTERNAL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transaction-network

  redis:
    image: redis:7-alpine
    container_name: transaction-redis
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    networks:
      - transaction-network

  kafka_controller_1:
    image: apache/kafka:latest
    container_name: kafka_controller_1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_controller_1_data:/var/lib/kafka/data
    networks:
      - transaction-network

  kafka_controller_2:
    image: apache/kafka:latest
    container_name: kafka_controller_2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_controller_2_data:/var/lib/kafka/data
    networks:
      - transaction-network

  kafka_controller_3:
    image: apache/kafka:latest
    container_name: kafka_controller_3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_controller_3_data:/var/lib/kafka/data
    networks:
      - transaction-network

  kafka_broker_1:
    image: apache/kafka:latest
    container_name: kafka_broker_1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: >
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka_broker_1:19092,
        PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_broker_1_data:/var/lib/kafka/data
    depends_on:
      - kafka_controller_1
      - kafka_controller_2
      - kafka_controller_3
    networks:
      - transaction-network

  kafka_broker_2:
    image: apache/kafka:latest
    container_name: kafka_broker_2
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: >
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka_broker_2:19092,
        PLAINTEXT_HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_broker_2_data:/var/lib/kafka/data
    depends_on:
      - kafka_controller_1
      - kafka_controller_2
      - kafka_controller_3
    networks:
      - transaction-network

  kafka_broker_3:
    image: apache/kafka:latest
    container_name: kafka_broker_3
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: >
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka_broker_3:19092,
        PLAINTEXT_HOST://localhost:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka_controller_1:9093,
        2@kafka_controller_2:9093,
        3@kafka_controller_3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_broker_3_data:/var/lib/kafka/data
    depends_on:
      - kafka_controller_1
      - kafka_controller_2
      - kafka_controller_3
    networks:
      - transaction-network

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - kafka_broker_1
      - kafka_broker_2
      - kafka_broker_3
    volumes:
      - ./kafka-init.sh:/kafka-init.sh
    command: ["bash", "/kafka-init.sh"]
    networks:
      - transaction-network

  generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generator
    container_name: transaction-generator
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER}
    depends_on:
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - transaction-network

  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    env_file:
      - ../config/.env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    volumes:
      - spark_checkpoints:/app/checkpoints
    networks:
      - transaction-network

volumes:

  postgres_data:

  kafka_controller_1_data:
  kafka_controller_2_data:
  kafka_controller_3_data:

  kafka_broker_1_data:
  kafka_broker_2_data:
  kafka_broker_3_data:

  spark_checkpoints:



networks:

  transaction-network:
