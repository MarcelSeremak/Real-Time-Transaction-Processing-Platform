[project]
name = "transactionpipeline"
version = "0.1.0"
description = "Transactions Pipeline Configuration"
authors = [
    {name = "Marcel Seremak",email = "marcelseremak47@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "faker (>=40.36.0,<41.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "db", from = "src" },
    { include = "generator", from = "src" },
    { include = "utils", from = "src" }
]